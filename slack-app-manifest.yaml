display_information:
  name: Second Shift
  description: Reshuffles a service crew's day when a technician calls out.
  background_color: "#1f2937"
features:
  bot_user:
    display_name: Second Shift
    always_online: true
oauth_config:
  scopes:
    bot:
      - channels:history
      - channels:read
      - channels:join
      - chat:write
      - chat:write.public
      - users:read
settings:
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
