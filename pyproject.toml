[project]
name = "second-shift"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.5.0",
    "fastapi>=0.141.1",
    "google-api-python-client>=2.200.0",
    "google-auth-httplib2>=0.4.2",
    "google-auth-oauthlib>=1.4.1",
    "openai>=3.13.0",
    "ortools>=9.15.6755",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.3",
    "slack-sdk>=3.44.1",
    "uvicorn[standard]>=0.52.4",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
